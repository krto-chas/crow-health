[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crow-health"
version = "0.3.0"
description = "Evidence-first foundation for personal health data"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1"]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
]

[project.scripts]
crow-health = "crow_health.cli:main"
crow-health-ha = "crow_health.ha.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["crow_health"]
