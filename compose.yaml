services:
  crow-health:
    build:
      context: .
    restart: unless-stopped
    user: "${CROW_HEALTH_UID:-1000}:${CROW_HEALTH_GID:-1000}"
    ports:
      - "${CROW_HEALTH_BIND_ADDRESS:-127.0.0.1}:${CROW_HEALTH_PORT:-8000}:8000"
    environment:
      CROW_HEALTH_STORE: /srv/crow-data/health/observations/observations.jsonl
      CROW_HEALTH_INDEX: /srv/crow-data/health/observations/observations.index.jsonl
      CROW_HEALTH_APPLE_MANIFEST_ROOT: /srv/crow-data/health/evidence/apple-health-manifests
      CROW_HEALTH_APPLE_MANIFEST_TOKEN: "${CROW_HEALTH_APPLE_MANIFEST_TOKEN:-}"
    volumes:
      - /srv/crow-data/health:/srv/crow-data/health
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
